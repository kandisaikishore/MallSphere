name: MallSphere CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
jobs:
  static-and-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check tests/server.js
          node --check playwright.config.js
          node --check tests/e2e.spec.js
      - name: Run static regression smoke tests
        run: npm run test:smoke
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Verify required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
          test -s docs/PRD.md
          test -s docs/ARCHITECTURE.md
          test -s docs/TEST_PLAN.md
      - name: Validate HTML entry points
        run: |
          grep -q 'id="pageContent"' index.html
          grep -q 'id="breadcrumbPage"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'href="styles.css"' index.html
