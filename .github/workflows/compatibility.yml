name: Compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required static assets
        run: |
          set -eu
          test -f index.html
          test -s index.html
          test -f styles.css
          test -s styles.css
          test -f app.js
          test -s app.js
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check for broken local asset references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"'#]+)["']/g)]
            .map(match => match[1])
            .filter(value => !/^(?:https?:|data:|mailto:|javascript:|\/\/)/i.test(value));
          const missing = refs.filter(ref => {
            const clean = decodeURIComponent(ref.split('?')[0]);
            return clean && !fs.existsSync(clean);
          });
          if (missing.length) {
            console.error('Missing local asset references:', [...new Set(missing)].join(', '));
            process.exit(1);
          }
          console.log('Local asset references validated.');
          NODE
      - name: Basic browser/runtime compatibility metadata
        run: |
          grep -qi '<!doctype html' index.html
          grep -qi 'name="viewport"' index.html
          grep -qi 'charset="utf-8"' index.html
